name: Release
on:
  push:
    tags:
      - "V0.*"

jobs:
  build:
    runs-on: windows-2022

    strategy:
        matrix:
          toolset: ["14.44"]

    steps:

      #############
      - name: 查找 Redist/MSVC 目录
        run: |
          # 定义可能的 Visual Studio 安装路径前缀
          $vsVersions = @("2022", "2019")
          $vsEditions = @("Enterprise", "Professional", "Community", "BuildTools")
          $foundPaths = @()
      
          # 遍历所有可能的组合路径
          foreach ($version in $vsVersions) {
            foreach ($edition in $vsEditions) {
              # 64位程序默认安装路径（Program Files）
              $path1 = "C:\Program Files\Microsoft Visual Studio\$version\$edition\VC\Redist\MSVC"
              # 32位兼容路径（Program Files (x86)）
              $path2 = "C:\Program Files (x86)\Microsoft Visual Studio\$version\$edition\VC\Redist\MSVC"
              
              if (Test-Path $path1) { $foundPaths += $path1 }
              if (Test-Path $path2) { $foundPaths += $path2 }
            }
          }
      
          # 输出找到的路径
          if ($foundPaths.Count -gt 0) {
            Write-Host "找到的 Redist/MSVC 目录："
            $foundPaths | ForEach-Object { Write-Host " - $_" }
          } else {
            Write-Warning "未找到 Redist/MSVC 目录"
          }
        shell: pwsh  # 使用 PowerShell 执行路径查找
      #############
    
      - uses: actions/checkout@v3
      - uses: ProjectSavanna/setup-sml@v1.2.0
        with:
          smlnj-version: '110.99.4'
      - uses: actions/setup-python@v1
        with:
          python-version: '3.x'
      - uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: ${{ matrix.toolset }} # 指定 14.X 工具集版本
          vsversion: '2022'

      - name: install-meson
        run: pip install meson ninja

      - name: repoint
        run: ./repoint install

      - name: Run build script
        run: |
          deploy\win64\build-and-package.bat

      - name: Create release package
        run: |
          mkdir release_package
          xcopy /E /I build_win64 release_package\build_win64
          7z a -tzip "sonic-visualiser-release.zip" "release_package\*"

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{github.ref_name}}
          release_name: Release ${{github.ref_name}}
          filess: sonic-visualiser-release.zip
          token: ${{secrets.GITHUB_TOKEN}}
