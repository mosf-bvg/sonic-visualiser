name: Release
on:
  push:
    tags:
      - "V0.*"

jobs:
  build:
    runs-on: windows-2022

    strategy:
        matrix:
          toolset: ["14.44"]

    steps:

      # 关键新增步骤：列出目标目录内容
      - name: 列出Redist x64目录下的内容
        run: |
          $targetDir = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\14.44.35112\x64\"
          echo "目标目录: $targetDir"
          if (Test-Path -Path $targetDir) {
              echo "目录存在，内容如下："
              Get-ChildItem -Path $targetDir -Recurse | Select-Object FullName
          } else {
              echo "ERROR: 目标目录不存在"
          }
        shell: pwsh
        continue-on-error: true  # 即使此步骤失败，也继续执行后续步骤
    
      - uses: actions/checkout@v3
      - uses: ProjectSavanna/setup-sml@v1.2.0
        with:
          smlnj-version: '110.99.4'
      - uses: actions/setup-python@v1
        with:
          python-version: '3.x'
      - uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: ${{ matrix.toolset }} # 指定 14.X 工具集版本
          vsversion: '2022'

      - name: install-meson
        run: pip install meson ninja

      - name: repoint
        run: ./repoint install

      - name: Run build script
        run: |
          deploy\win64\build-and-package.bat

      - name: Create release package
        run: |
          mkdir release_package
          xcopy /E /I build_win64 release_package\build_win64
          7z a -tzip "sonic-visualiser-release.zip" "release_package\*"

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{github.ref_name}}
          release_name: Release ${{github.ref_name}}
          filess: sonic-visualiser-release.zip
          token: ${{secrets.GITHUB_TOKEN}}
