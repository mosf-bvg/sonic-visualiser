name: Release
on:
  push:
    tags:
      - "V0.*"

jobs:
  build:
    runs-on: windows-2022

    strategy:
        matrix:
          toolset: ["14.44"]

    steps:
      - name: 安装 OpenSSL
        run: choco install openssl --version 3.0.0 -y  # 安装指定版本的 OpenSSL
      - name: 获取 OpenSSL 路径
        run: |
          # 查找安装路径（通常在 C:\Program Files\OpenSSL-Win64\）
          $opensslPath = (Get-Item "C:\Program Files\OpenSSL-Win64\bin").FullName
          echo "OPENSSL_PATH=$opensslPath" >> $env:GITHUB_ENV
        shell: pwsh
    
      - uses: actions/checkout@v3
      - uses: ProjectSavanna/setup-sml@v1.2.0
        with:
          smlnj-version: '110.99.4'
      - uses: actions/setup-python@v1
        with:
          python-version: '3.x'
      - uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: ${{ matrix.toolset }} # 指定 14.X 工具集版本
          vsversion: '2022'

      - name: install-meson
        run: pip install meson ninja

      - name: repoint
        run: ./repoint install

      - name: Run build script
        run: |
          deploy\win64\build-and-package.bat

      - name: Create release package
        run: |
          mkdir release_package
          xcopy /E /I build_win64 release_package\build_win64
          7z a -tzip "sonic-visualiser-release.zip" "release_package\*"

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{github.ref_name}}
          release_name: Release ${{github.ref_name}}
          filess: sonic-visualiser-release.zip
          token: ${{secrets.GITHUB_TOKEN}}
